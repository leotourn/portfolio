<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viweport" content="width=device-width, initial-scale=1.0">
        <title>Recorrido virtual</title>

        <!-- Estilos de la libreria -->
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/core@5.13.2/index.min.css">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/markers-plugin@5.13.2/index.min.css">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/virtual-tour-plugin@5.13.2/index.min.css">

        <!-- Mis estilos -->
        <link rel="stylesheet" href="css/style.css">
        <!-- Import map: le dice al navegador donde está cada librería -->
        <script type="importmap">
        {
          "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three/build/three.module.js",
            "@photo-sphere-viewer/core": "https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/core@5.13.2/index.module.js",
            "@photo-sphere-viewer/markers-plugin": "https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/markers-plugin@5.13.2/index.module.js",
            "@photo-sphere-viewer/virtual-tour-plugin": "https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/virtual-tour-plugin@5.13.2/index.module.js"
          }
        }
        </script>
    </head>
    <body>
        <div id="viewer"></div>
        <nav id="menu">
            <button data-nodo="acceso">Acceso</button>
            <button data-nodo="pasillo">Pasillo</button>
            <button data-nodo="comedor">Comedor</button>
            <button data-nodo="living">Living</button>
            <button data-nodo="cocina">Cocina</button>
            <button data-nodo="escalera">Escalera</button>
            <button data-nodo="arriba">Segunda Planta</button>
            <button data-nodo="dormitorio">Cuarto Principal</button>
            <button data-nodo="terraza">Terraza</button>
            <button data-nodo="deck">Deck</button>
            <!-- uno por cada nodo, usando los mismos id de tu tour -->
        </nav>
        <script type="module" src="js/main.js"></script>
    </body>
</html>
