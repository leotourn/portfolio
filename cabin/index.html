    <head>

        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Recorrido virtual</title>

        <!-- Estilos de la libreria -->
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/core@5.13.2/index.min.css">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/markers-plugin@5.13.2/index.min.css">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/virtual-tour-plugin@5.13.2/index.min.css">

        <!-- Giroscopio-->
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/gyroscope-plugin@5.13.2/index.min.css">

        <!-- Mapa -->
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/map-plugin@5.13.2/index.min.css">

        <!-- Mis estilos -->
        <link rel="stylesheet" href="css/style.css">
        <!-- Import map: le dice al navegador donde está cada librería -->
        <script type="importmap">
        {
          "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three/build/three.module.js",
            "@photo-sphere-viewer/core": "https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/core@5.13.2/index.module.js",

            "@photo-sphere-viewer/gyroscope-plugin": "https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/gyroscope-plugin@5.13.2/index.module.js",
            "@photo-sphere-viewer/map-plugin": "https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/map-plugin@5.13.2/index.module.js"
          }
        }
        </script>

    </head>
    <body>
        <div id="viewer"></div>
        <nav id="menu">
        </nav>
        <div id="plano" class="cambiando">
            <img id="plano-img" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" alt="Plano de la casa">
            <div id="plano-punto">
                <div id="plano-cono"></div>
            </div>
        </div>
        <script type="module" src="js/main.js"></script>
