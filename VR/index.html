<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tour Virtual 360</title>

    <!-- Librerías (asegúrate de que las rutas sean correctas según tu configuración) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/core@5.7.1/index.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/markers-plugin@5.7.1/index.min.css" />

    <!-- Importar fuente Montserrat de Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #1a1a1a; }
        #viewer { width: 100vw; height: 100vh; }

        /* --- ESTILO UNIFICADO PARA TODOS LOS BOTONES DEL TOUR --- */
        .vr-button {
            /* 1. TIPOGRAFÍA Y TEXTO */
            font-family: 'Montserrat', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            font-size: 8px;           /* Tamaño legible en 3D */
            font-weight: 700;          /* 700 es negrita, 600 es semi-negrita, 400 es normal */
            text-transform: uppercase; /* Convierte automáticamente "entrar" a "ENTRAR" */
            letter-spacing: 1.5px;     /* Espacio entre letras (da un look premium y limpio) */
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.6); /* Sombra al texto para que se lea sobre cualquier fondo */
            color: #ffffff;            /* Color del texto */

            /* 2. FORMA Y FONDO DEL BOTÓN */
            background: rgba(30, 30, 30, 0.25); /* Fondo oscuro semitransparente */
            backdrop-filter: blur(6px);         /* Efecto "vidrio esmerilado" detrás del botón (muy moderno) */
            padding: 6px 12px;
            border-radius: 5px;                /* Bordes completamente redondeados (tipo píldora) */
            border: 1px solid rgba(255, 255, 255, 0.2); /* Borde sutil blanco */

            /* 3. COMPORTAMIENTO */
            cursor: pointer;
            white-space: nowrap;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1); /* Animación ultra suave */
        }

        /* Efecto cuando el usuario pasa el mouse por encima (o toca en móvil) */
        .vr-button:hover {
            background: rgba(255, 255, 255, 0.9); /* El fondo se vuelve blanco */
            color: #1a1a1a;                        /* El texto se vuelve oscuro */
            text-shadow: none;                     /* Quitamos la sombra del texto para que se vea nítido */
            transform: translateY(-2px) scale(1.05); /* Se eleva y crece un poco */
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.5);
            border-color: rgba(255, 255, 255, 0.8);
        }
    </style>
</head>
<body>
    <div id="viewer"></div>

    <script src="https://cdn.jsdelivr.net/npm/three@0.150.1/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/core@5.7.1/index.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/markers-plugin@5.7.1/index.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
